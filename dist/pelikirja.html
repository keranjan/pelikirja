<style>
/* Pelikirja – mobiilioptimoitu tyylitiedosto */
:root {
  --bg: #0d1512;
  --bg-2: #111c17;
  --surface: #16231d;
  --surface-2: #1d2f27;
  --line: #24382f;
  --text: #e9f2ec;
  --muted: #90a89c;
  --accent: #3ddc84;
  --accent-dim: #1f6d45;
  --danger: #ff6b6b;
  --warn: #ffc861;
  --info: #6bb8ff;
  --radius: 14px;
  --tabbar-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

#app { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
@media (min-width: 600px) {
  #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

/* ---------- Topbar ---------- */
#topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(var(--safe-t) + 10px) 14px 10px;
  background: linear-gradient(180deg, var(--bg-2) 70%, rgba(13,21,18,0.85));
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; min-height: 56px;
}
#topbar h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
#topbar .sub { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.iconbtn {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  font-size: 18px; cursor: pointer; flex: none; padding: 0;
}
.iconbtn:active { background: var(--line); }
.iconbtn.wide { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; gap: 6px; }

/* ---------- Main ---------- */
#view { flex: 1; padding: 14px 14px calc(var(--tabbar-h) + var(--safe-b) + 24px); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 2px 6px; font-weight: 700; }
.section-title:first-child { margin-top: 2px; }

/* ---------- Tabbar ---------- */
#tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 30;
  width: 100%; max-width: 560px;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: rgba(17,28,23,0.96); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
#tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 600;
}
#tabbar a .ic { font-size: 20px; line-height: 1; }
#tabbar a.active { color: var(--accent); }

/* ---------- Kortit ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px;
}
button.card, a.card { display: block; width: 100%; text-align: left; cursor: pointer; text-decoration: none; color: inherit; }
button.card.row, a.card.row { display: flex; }
button.card.stack, a.card.stack { display: flex; flex-direction: column; }
button.card:active, a.card:active { background: var(--surface-2); }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.center { text-align: center; }

.empty { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty .big { font-size: 40px; display: block; margin-bottom: 10px; opacity: .8; }

/* ---------- Merkit ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--line); white-space: nowrap;
}
.badge.accent { color: var(--accent); border-color: var(--accent-dim); background: rgba(61,220,132,.1); }
.badge.win { color: var(--accent); border-color: var(--accent-dim); background: rgba(61,220,132,.12); }
.badge.draw { color: var(--warn); border-color: #5a4a20; background: rgba(255,200,97,.1); }
.badge.loss { color: var(--danger); border-color: #5a2626; background: rgba(255,107,107,.1); }

.numchip {
  font-variant-numeric: tabular-nums;
  flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 14px;
}
.numchip.accent { background: rgba(61,220,132,.14); border-color: var(--accent-dim); color: var(--accent); }

/* ---------- Lomake ---------- */
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 11px;
  padding: 11px 12px; outline: none; -webkit-appearance: none; appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent-dim); }
textarea { min-height: 76px; resize: vertical; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field-row { display: flex; gap: 10px; }
.field-row > * { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 12px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%;
}
.btn:active { transform: scale(.99); }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #05130b; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: #45262a; background: rgba(255,107,107,.08); }
.btn.sm { padding: 8px 12px; font-size: 13px; width: auto; border-radius: 10px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--bg-2); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
}
.chip.on { background: rgba(61,220,132,.14); border-color: var(--accent-dim); color: var(--accent); }

.segmented { display: flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.segmented button { flex: 1; background: none; border: 0; padding: 9px 6px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: var(--surface-2); color: var(--text); }

/* ---------- Kenttä ---------- */
.pitch-wrap { position: relative; }
.pitch {
  position: relative; width: 100%; aspect-ratio: 68 / 95;
  border-radius: var(--radius); overflow: hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 8%, rgba(0,0,0,0) 8% 16%),
    linear-gradient(160deg, #1c4a33, #133525 60%, #0f2b1e);
  border: 1px solid var(--line);
}
.pitch .lines { position: absolute; inset: 0; }
.pitch .lines * { stroke: rgba(255,255,255,.22); fill: none; stroke-width: .6; }

.slot {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 74px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
}
.slot .disc {
  font-variant-numeric: tabular-nums;
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: #05130b; font-weight: 800; font-size: 15px;
  border: 2px solid rgba(255,255,255,.5); box-shadow: 0 3px 8px rgba(0,0,0,.4);
}
.slot.empty .disc { background: rgba(6,20,13,.55); color: rgba(255,255,255,.6); border-style: dashed; border-color: rgba(255,255,255,.45); font-weight: 600; font-size: 11px; }
.slot.gk:not(.empty) .disc { background: var(--warn); }
.slot .nm {
  font-size: 10.5px; font-weight: 700; max-width: 100%; text-align: center;
  background: rgba(4,14,9,.6); padding: 1px 5px; border-radius: 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.slot .pos { font-size: 9.5px; color: rgba(255,255,255,.65); font-weight: 700; letter-spacing: .04em; }
.slot.picking .disc { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- Alapaneeli (sheet) ---------- */
#overlay:empty { display: none; }
#overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.55); }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column;
  background: var(--bg-2); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0; padding-bottom: var(--safe-b);
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .4 } to { transform: none; opacity: 1 } }
.sheet header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.sheet header h2 { font-size: 16px; margin: 0; flex: 1; }
.sheet .body { padding: 14px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

.list-item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; cursor: pointer; color: inherit; margin-bottom: 8px;
}
.list-item:active { background: var(--surface-2); }
.list-item.off { opacity: .45; }
.list-item.sel { border-color: var(--accent-dim); background: rgba(61,220,132,.08); }

#toast:empty { display: none; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px); z-index: 200;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 22px rgba(0,0,0,.5);
}

table.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.stats th, table.stats td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats th { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }

.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
.kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

</style>
<title>Pelikirja</title>
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar"></nav>
  </div>
  <div id="overlay"></div>
  <div id="toast" aria-live="polite"></div>
<script type="module">

window.__PELIKIRJA_YKSITIEDOSTO__ = true;   // yhden tiedoston versiossa ei ole erillistä service workeria
const __mods = {}, __cache = {};
const __req = (name) => (__cache[name] ??= __mods[name]());
__mods['router'] = () => {
// Kevyt reititys: näkymät navigoivat tämän kautta, jolloin ne eivät riipu app.js:stä.
let renderer = () => {};

const setRenderer = (fn) => { renderer = fn; };

function navigate(hash) {
  if (location.hash === hash) renderer();
  else location.hash = hash;
}

return { setRenderer, navigate };
};

__mods['formations'] = () => {
// Pelipaikat ja pelisysteemit.

    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k in el && k !== 'list' && typeof v !== 'object') el[k] = v;
    else el.setAttribute(k, v);

  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));

  return el;

    h('div', { class: 'center' },
      h('div', { class: 'tiny muted bold', text: 'KENTÄLLÄ' }),
      h('div', { class: 'bold', style: 'font-size:20px;padding-top:6px',

      class: `slot${p ? '' : ' empty'}${slot.pos === 'MV' ? ' gk' : ''}`,
      style: `left:${slot.x}%;top:${slot.y}%`,

      onclick: () => openPicker(lineup, i, commit),
    },
      h('span', { class: 'disc', text: p ? (p.number ?? initials(p.name)) : slot.pos }),
      p ? h('span', { class: 'nm', text: shortName(p.name) }) : null,

    h('button', {
      class: 'btn sm ghost', style: 'flex:1',
      onclick: () => commit(() => { lineup.slots = lineup.slots.map(() => null); }),
    }, 'Tyhjennä kenttä')));

  wrap.append(h('div', { class: 'section-title', text: `Vaihtopenkki (${lineup.bench.length})` }));

    for (const pid of unavailable) {

        h('span', { class: 'numchip', text: p.number ?? '–' }),
        h('span', { class: 'grow ellip muted', text: p.name }),

}

/* ---------- Pelaajan valinta paikkaan ---------- */

function openPicker(lineup, slotIndex, commit) {
  const formation = getFormation(lineup.formation);
  const slot = formation.slots[slotIndex];
  const wanted = roleForPosition(slot.pos);
  const current = lineup.slots[slotIndex];

  sheet(`${POSITIONS[slot.pos] || slot.pos}`, (body, close) => {
    const players = sortedPlayers(getState().players.filter((p) => p.active !== false));
    const fits = players.filter((p) => (p.roles || []).includes(wanted));
    const rest = players.filter((p) => !fits.includes(p));

    if (current) {
      body.append(h('button', {
        class: 'btn danger', style: 'margin-bottom:12px',
        onclick: () => { commit(() => assignToSlot(lineup, slotIndex, null)); close(); },
      }, 'Tyhjennä paikka'));
    }
    if (!players.length) {
      body.append(h('p', { class: 'muted', text: 'Lisää ensin pelaajia Pelaajat-välilehdellä.' }));
      return;
    }

    const item = (p) => {
      const role = lineupRole(lineup, p.id);
      return h('button', {
        class: `list-item${p.id === current ? ' sel' : ''}${role === 'poissa' ? ' off' : ''}`,
        onclick: () => { commit(() => assignToSlot(lineup, slotIndex, p.id)); close(); },
      },
        h('span', { class: `numchip${p.id === current ? ' accent' : ''}`, text: p.number ?? '–' }),
        h('span', { class: 'grow' },
          h('div', { class: 'bold ellip', text: p.name }),
          h('div', { class: 'tiny muted', text: (p.roles || []).join(' · ') || 'ei pelipaikkoja' })),
        role && role !== 'poissa'
          ? h('span', { class: 'badge', text: role === 'aloittava' ? 'kentällä' : 'penkki' })
          : role === 'poissa' ? h('span', { class: 'badge', text: 'poissa' }) : null);
    };

    if (fits.length) {
      body.append(h('div', { class: 'section-title', text: `Sopivat pelipaikalle (${wanted})` }));
      fits.forEach((p) => body.append(item(p)));
    }
    if (rest.length) {
      body.append(h('div', { class: 'section-title', text: 'Muut pelaajat' }));
      rest.forEach((p) => body.append(item(p)));
    }
  });
}

/* ---------- Koko ryhmän hallinta ---------- */

function openSquadSheet(lineup, commit) {
  sheet('Ryhmä', (body) => {
    const draw = () => {
      body.replaceChildren();
      const players = sortedPlayers(getState().players.filter((p) => p.active !== false));
      if (!players.length) {
        body.append(h('p', { class: 'muted', text: 'Lisää ensin pelaajia Pelaajat-välilehdellä.' }));
        return;
      }
      body.append(h('p', { class: 'tiny muted', text: 'Valitse jokaiselle pelaajalle rooli tähän otteluun.' }));
      for (const p of players) {
        const role = lineupRole(lineup, p.id);
        body.append(h('div', { class: 'card', style: 'margin-bottom:8px' },
          h('div', { class: 'row', style: 'margin-bottom:8px' },
            h('span', { class: 'numchip', text: p.number ?? '–' }),
            h('span', { class: 'grow ellip bold', text: p.name }),
            role === 'aloittava' ? h('span', { class: 'badge accent', text: 'kentällä' }) : null),
          h('div', { class: 'segmented' },
            h('button', {
              class: lineup.bench.includes(p.id) ? 'on' : '',
              onclick: () => { commit(() => toggleBench(lineup, p.id)); draw(); },
            }, 'Vaihtopenkki'),
            h('button', {
              class: (lineup.unavailable || []).includes(p.id) ? 'on' : '',
              onclick: () => { commit(() => toggleUnavailable(lineup, p.id)); draw(); },
            }, 'Poissa'))));
      }
    };
    draw();
  });
}

/* ---------- Automaattitäyttö ---------- */

function autoFill(lineup) {
  const formation = getFormation(lineup.formation);
  const used = new Set(lineup.slots.filter(Boolean));
  const unavailable = new Set(lineup.unavailable || []);
  const pool = sortedPlayers(getState().players.filter(
    (p) => p.active !== false && !used.has(p.id) && !unavailable.has(p.id)));

  formation.slots.forEach((slot, i) => {
    if (lineup.slots[i]) return;
    const wanted = roleForPosition(slot.pos);
    let idx = pool.findIndex((p) => (p.roles || []).includes(wanted));
    if (idx < 0) idx = pool.findIndex((p) => !(p.roles || []).includes('MV'));
    if (idx < 0) return;
    const [p] = pool.splice(idx, 1);
    lineup.slots[i] = p.id;
    lineup.bench = lineup.bench.filter((v) => v !== p.id);
  });

  const empties = lineup.slots.filter((v) => !v).length;
  toast(empties ? `${empties} paikkaa jäi tyhjäksi` : 'Kokoonpano täytetty');
}

return { renderLineupEditor };
};

  const body = h('div', { class: 'stack' });
  body.append(h('div', { class: 'segmented' },
    ...[['kokoonpano', 'Kokoonpano'], ['tulos', 'Tulos'], ['tiedot', 'Tiedot']].map(([k, label]) =>
      h('button', { class: tab === k ? 'on' : '', onclick: () => { tab = k; navigate(`#/ottelu/${id}`); } }, label))));

  if (tab === 'kokoonpano') body.append(lineupTab(m));
  else if (tab === 'tulos') body.append(resultTab(m));
  else body.append(infoTab(m));

  return {
    title: `${m.home ? 'vs' : '@'} ${m.opponent || 'Vastustaja'}`,
    subtitle: `${fmtDate(m.date)} klo ${m.time}`,
    back: '#/ottelut',
    body,
  };
}

/* ---------- Kokoonpano ---------- */

function lineupTab(m) {
  const wrap = h('div', { class: 'stack' });
  // m.lineup on sama olio kuin tilassa, joten muutokset tallentuvat suoraan.
  wrap.append(renderLineupEditor(m.lineup, (fn) => update(fn)));

  wrap.append(h('hr', { class: 'sep' }));
  wrap.append(h('div', { class: 'btn-row' },
    h('button', { class: 'btn sm', style: 'flex:1', onclick: () => openTemplatePicker(m) }, '📋 Hae pohjasta'),
    h('button', { class: 'btn sm', style: 'flex:1', onclick: () => saveAsTemplate(m) }, '💾 Tallenna pohjaksi')));
  wrap.append(h('button', { class: 'btn', onclick: () => shareLineup(m) }, '📤 Jaa kokoonpano'));

  return wrap;
}

function openTemplatePicker(m) {
  sheet('Hae kokoonpanopohjasta', (body, close) => {
    const lineups = getState().lineups;
    if (!lineups.length) {
      body.append(h('p', { class: 'muted', text: 'Ei tallennettuja pohjia. Luo pohja Kokoonpanot-välilehdellä.' }));
      return;
    }
    for (const l of lineups) {
      const f = getFormation(l.lineup.formation);
      body.append(h('button', {
        class: 'list-item',
        onclick: () => {
          updateMatch(m.id, { lineup: cloneLineup(lineupById(l.id).lineup) });
          close();
          toast('Kokoonpano haettu pohjasta');
        },
      },
        h('span', { class: 'grow' },
          h('div', { class: 'bold', text: l.name }),
          h('div', { class: 'tiny muted', text: `${f.name} · ${l.lineup.slots.filter(Boolean).length}/${f.slots.length} pelaajaa` }))));
    }
  });
}

function saveAsTemplate(m) {
  sheet('Tallenna kokoonpanopohjaksi', (body, close) => {
    const nameI = h('input', {
      type: 'text',
      value: `${getFormation(m.lineup.formation).name} vs ${m.opponent || fmtDate(m.date)}`,
      placeholder: 'Pohjan nimi',
    });
    body.append(
      h('label', { class: 'field' }, h('span', { text: 'Nimi' }), nameI),
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const name = nameI.value.trim() || 'Kokoonpano';
          const l = addLineup(name, m.lineup.formation);
          update((st) => {
            const t = st.lineups.find((x) => x.id === l.id);
            t.lineup = cloneLineup(m.lineup);
          });
          close();
          toast('Pohja tallennettu');
        },
      }, 'Tallenna pohja'));
  });
}

/* ---------- Ottelun video ---------- */

function videoBlock(m) {
  const video = videoInfo(m.videoUrl);
  const wrap = h('div', { class: 'stack', style: 'margin-top:16px' });

  if (!video) {
    wrap.append(h('button', { class: 'btn', onclick: () => openVideoSheet(m) }, '🎬 Lisää videolinkki'));
    return wrap;
  }

  wrap.append(h('a', {
    class: 'btn primary', href: video.url, target: '_blank', rel: 'noopener noreferrer',
  }, video.known ? `▶︎ Katso ${video.service}-tallenne` : '▶︎ Katso ottelun tallenne'));
  wrap.append(h('div', { class: 'row between' },
    h('span', { class: 'tiny muted ellip', text: video.host }),
    h('button', { class: 'btn sm ghost', onclick: () => openVideoSheet(m) }, 'Muokkaa linkkiä')));
  return wrap;
}

function openVideoSheet(m) {
  sheet('Ottelun video', (body, close) => {
    const input = h('input', {
      type: 'text', value: m.videoUrl || '', inputmode: 'url', autocomplete: 'off',
      placeholder: 'https://app.veo.co/matches/...',
    });

    body.append(
      h('p', { class: 'small muted', text: 'Liitä ottelun tallenteen osoite, esimerkiksi Veosta. Linkki avautuu uuteen välilehteen – video toistetaan palvelun omassa sovelluksessa.' }),
      h('label', { class: 'field' }, h('span', { text: 'Videolinkki' }), input),
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const value = input.value.trim();
          if (value && !videoInfo(value)) {
            toast('Videolinkin pitää alkaa https://');
            input.focus();
            return;
          }
          updateMatch(m.id, { videoUrl: value });
          close();
          toast(value ? 'Videolinkki tallennettu' : 'Videolinkki poistettu');
        },
      }, 'Tallenna'),
      m.videoUrl ? h('button', {
        class: 'btn danger', style: 'margin-top:10px',
        onclick: () => { updateMatch(m.id, { videoUrl: '' }); close(); toast('Videolinkki poistettu'); },
      }, 'Poista linkki') : null);

    setTimeout(() => input.focus(), 60);
  });
}

/* ---------- Kokoonpanon jakaminen ---------- */

function lineupText(m) {
  const st = getState();
  const f = getFormation(m.lineup.formation);
  const who = (id) => {
    const p = playerById(id);
    if (!p) return '–';
    return `${p.number != null ? p.number + ' ' : ''}${p.name}`;
  };
  const lines = [
    `${st.team.name || 'Oma joukkue'} ${m.home ? 'vs' : '@'} ${m.opponent || 'vastustaja'}`,
    `${fmtDate(m.date)} klo ${m.time}${m.venue ? ' · ' + m.venue : ''}`,
    `Kokoonpano ${f.name}`,
    '',
  ];
  f.slots.forEach((slot, i) => {
    const pid = m.lineup.slots[i];
    lines.push(`${slot.pos.padEnd(4, ' ')}${pid ? who(pid) : '(avoin)'}`);
  });
  if (m.lineup.bench.length) lines.push('', `Vaihdot: ${m.lineup.bench.map(who).join(', ')}`);
  if ((m.lineup.unavailable || []).length) lines.push(`Poissa: ${m.lineup.unavailable.map(who).join(', ')}`);
  if (m.notes) lines.push('', m.notes);
  return lines.join('\n');
}

async function shareLineup(m) {
  const text = lineupText(m);
  const title = `Kokoonpano – ${m.opponent || 'ottelu'}`;
  try {
    if (navigator.share) { await navigator.share({ title, text }); return; }
    await navigator.clipboard.writeText(text);
    toast('Kokoonpano kopioitu leikepöydälle');
    return;
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  sheet('Kokoonpano tekstinä', (body) => {
    const ta = h('textarea', { style: 'min-height:340px;font-family:ui-monospace,monospace;font-size:13px', text });
    body.append(h('p', { class: 'tiny muted', text: 'Kopioi teksti ja liitä se vaikka joukkueen WhatsApp-ryhmään.' }), ta);
    setTimeout(() => { ta.focus(); ta.select(); }, 60);
  });
}

/* ---------- Tulos ---------- */

function resultTab(m) {
  const wrap = h('div', { class: 'stack' });

  if (!m.result) {
    wrap.append(h('div', { class: 'empty' },
      h('span', { class: 'big', text: '📝' }),
      h('p', { text: 'Ottelua ei ole vielä pelattu.' }),
      h('p', { class: 'small', text: 'Kirjaa lopputulos ja maalintekijät, kun ottelu on pelattu.' })));
    wrap.append(h('button', {
      class: 'btn primary',
      onclick: () => updateMatch(m.id, { result: { gf: 0, ga: 0, events: [], notes: '' } }),
    }, '＋ Kirjaa tulos'));
    return wrap;
  }

  const r = m.result;
  const setScore = (key, delta) => updateMatch(m.id, {
    result: { ...r, [key]: Math.max(0, (r[key] || 0) + delta) },
  });

  const counter = (label, key) => h('div', { class: 'card center', style: 'flex:1' },
    h('div', { class: 'tiny muted bold ellip', text: label }),
    h('div', { class: 'row', style: 'justify-content:center;gap:14px;margin-top:6px' },
      h('button', { class: 'iconbtn', onclick: () => setScore(key, -1) }, '−'),
      h('span', { style: 'font-size:32px;font-weight:800;min-width:38px;font-variant-numeric:tabular-nums', text: String(r[key] || 0) }),
      h('button', { class: 'iconbtn', onclick: () => setScore(key, 1) }, '＋')));

  wrap.append(h('div', { class: 'row', style: 'gap:10px;align-items:stretch' },
    counter(m.home ? (getState().team.name || 'Me') : (m.opponent || 'Vastustaja'), m.home ? 'gf' : 'ga'),
    counter(m.home ? (m.opponent || 'Vastustaja') : (getState().team.name || 'Me'), m.home ? 'ga' : 'gf')));

  const outcome = r.gf > r.ga ? ['win', 'Voitto'] : r.gf === r.ga ? ['draw', 'Tasapeli'] : ['loss', 'Tappio'];
  wrap.append(h('div', { class: 'center' }, h('span', { class: `badge ${outcome[0]}`, text: outcome[1] })));

  wrap.append(videoBlock(m));

  wrap.append(h('div', { class: 'section-title', text: `Maalit (${r.events.length})` }));
  if (!r.events.length) {
    wrap.append(h('div', { class: 'card small muted', text: 'Ei kirjattuja maalintekijöitä.' }));
  } else {
    const sorted = [...r.events].sort((a, b) => (a.minute ?? 999) - (b.minute ?? 999));
    for (const ev of sorted) {
      wrap.append(h('div', { class: 'card row' },
        h('span', { class: 'numchip', text: ev.minute != null ? `${ev.minute}'` : '–' }),
        h('span', { class: 'grow' },
          h('div', { class: 'bold ellip', text: `⚽ ${playerName(ev.scorerId)}` }),
          ev.assistId ? h('div', { class: 'tiny muted ellip', text: `Syöttö: ${playerName(ev.assistId)}` }) : null),
        h('button', {
          class: 'btn sm ghost',
          onclick: () => updateMatch(m.id, { result: { ...r, events: r.events.filter((x) => x.id !== ev.id) } }),
        }, '✕')));
    }
  }
  wrap.append(h('button', { class: 'btn', onclick: () => openGoalSheet(m) }, '＋ Lisää maali'));

  const notesI = h('textarea', { placeholder: 'Ottelumuistiinpanot', text: r.notes || '' });
  notesI.addEventListener('change', () => updateMatch(m.id, { result: { ...matchById(m.id).result, notes: notesI.value } }));
  wrap.append(h('label', { class: 'field', style: 'margin-top:16px' }, h('span', { text: 'Ottelumuistiinpanot' }), notesI));

  wrap.append(h('button', {
    class: 'btn danger',
    onclick: async () => {
      if (await confirmSheet('Poista tulos', 'Tulos ja maalit poistetaan. Ottelu palaa tuleviin tapahtumiin.')) {
        updateMatch(m.id, { result: null });
        toast('Tulos poistettu');
      }
    },
  }, 'Poista tulos'));

  return wrap;
}

function openGoalSheet(m) {
  sheet('Lisää maali', (body, close) => {
    const lu = m.lineup;
    const involved = [...lu.slots.filter(Boolean), ...lu.bench];
    const all = sortedPlayers(getState().players);
    const ordered = [
      ...all.filter((p) => involved.includes(p.id)),
      ...all.filter((p) => !involved.includes(p.id)),
    ];

    const minuteI = h('input', { type: 'number', placeholder: 'esim. 34', inputmode: 'numeric', min: '0', max: '130' });
    const scorerSel = h('select', {}, ...ordered.map((p) =>
      h('option', { value: p.id, text: `${p.number != null ? p.number + '. ' : ''}${p.name}` })));
    const assistSel = h('select', {},
      h('option', { value: '', text: 'Ei syöttäjää' }),
      ...ordered.map((p) => h('option', { value: p.id, text: `${p.number != null ? p.number + '. ' : ''}${p.name}` })));

    if (!ordered.length) {
      body.append(h('p', { class: 'muted', text: 'Lisää ensin pelaajia.' }));
      return;
    }

    body.append(
      h('label', { class: 'field' }, h('span', { text: 'Maalintekijä' }), scorerSel),
      h('label', { class: 'field' }, h('span', { text: 'Syöttäjä' }), assistSel),
      h('label', { class: 'field' }, h('span', { text: 'Minuutti' }), minuteI),
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const r = matchById(m.id).result;
          const ev = {
            id: uid(),
            scorerId: scorerSel.value,
            assistId: assistSel.value || null,
            minute: minuteI.value === '' ? null : Number(minuteI.value),
          };
          updateMatch(m.id, { result: { ...r, events: [...r.events, ev], gf: (r.gf || 0) + 1 } });
          close();
          toast('Maali kirjattu');
        },
      }, 'Lisää maali'));
  });
}

/* ---------- Tiedot ---------- */

function infoTab(m) {
  const wrap = h('div', { class: 'stack' });
  const row = (k, v) => h('div', { class: 'card row between' },
    h('span', { class: 'small muted', text: k }), h('span', { class: 'bold ellip', text: v || '–' }));

  wrap.append(
    row('Vastustaja', m.opponent),
    row('Päivä', fmtDate(m.date)),
    row('Alkaa', m.time),
    row('Paikka', m.venue),
    row('Tyyppi', TYPES[m.type] || m.type),
    row('Koti/vieras', m.home ? 'Kotiottelu' : 'Vierasottelu'));

  const video = videoInfo(m.videoUrl);
  wrap.append(h('div', { class: 'card row between' },
    h('span', { class: 'small muted', text: 'Video' }),
    video
      ? h('a', { class: 'bold ellip', href: video.url, target: '_blank', rel: 'noopener noreferrer', style: 'color:var(--accent)', text: `${video.service} ↗` })
      : h('span', { class: 'bold', text: '–' })));

  if (m.notes) {
    wrap.append(h('div', { class: 'section-title', text: 'Muistiinpanot' }));
    wrap.append(h('div', { class: 'card small', text: m.notes }));
  }

  wrap.append(h('button', { class: 'btn', style: 'margin-top:10px', onclick: () => openMatchSheet(m) }, '✏️ Muokkaa tapahtumaa'));
  wrap.append(h('button', {
    class: 'btn danger',
    onclick: async () => {
      if (await confirmSheet('Poista tapahtuma', 'Tapahtuma, sen kokoonpano ja tulos poistetaan pysyvästi.')) {
        removeMatch(m.id);
        toast('Tapahtuma poistettu');
        navigate('#/ottelut');
      }
    },
  }, 'Poista tapahtuma'));

  return wrap;
}

return { matchView };
};

        if (ev.assistId === p.id) assists++;
      }

  }).filter((r) => r.starts || r.subs || r.goals || r.assists);
