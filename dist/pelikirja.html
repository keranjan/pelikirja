  --pitch-chip-ink: #14261C;

  --shadow-sm: 0 1px 2px rgba(15,26,20,.05);
  --shadow-md: 0 2px 4px rgba(15,26,20,.04), 0 12px 28px -14px rgba(15,26,20,.24);
  --shadow-accent: 0 8px 20px -10px rgba(11,122,69,.55);

  --radius: 16px;
  --radius-sm: 10px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E1512;
    --surface: #16211B;
    --surface-2: #1E2C24;
    --line: #27362E;
    --line-strong: #35473C;

    --ink: #E9F1EB;
    --ink-2: #A9BAB0;
    --ink-3: #7F9187;

    --accent: #3DDC84;
    --accent-ink: #06170E;
    --accent-soft: rgba(61,220,132,.13);
    --accent-line: rgba(61,220,132,.32);

    --amber: #F0B454;
    --amber-soft: rgba(240,180,84,.14);
    --amber-line: rgba(240,180,84,.32);

    --red: #FF8175;
    --red-soft: rgba(255,129,117,.13);
    --red-line: rgba(255,129,117,.32);

    --pitch-a: #1D4B34;
    --pitch-b: #11301F;
    --pitch-line: rgba(255,255,255,.22);
    --pitch-chip: rgba(6,18,12,.74);
    --pitch-chip-ink: #E9F1EB;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 2px 4px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.8);
    --shadow-accent: 0 8px 20px -10px rgba(61,220,132,.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --paper: #0E1512;
  --surface: #16211B;
  --surface-2: #1E2C24;
  --line: #27362E;
  --line-strong: #35473C;

  --ink: #E9F1EB;
  --ink-2: #A9BAB0;
  --ink-3: #7F9187;

  --accent: #3DDC84;
  --accent-ink: #06170E;
  --accent-soft: rgba(61,220,132,.13);
  --accent-line: rgba(61,220,132,.32);

  --amber: #F0B454;
  --amber-soft: rgba(240,180,84,.14);
  --amber-line: rgba(240,180,84,.32);

  --red: #FF8175;
  --red-soft: rgba(255,129,117,.13);
  --red-line: rgba(255,129,117,.32);

  --pitch-a: #1D4B34;
  --pitch-b: #11301F;
  --pitch-line: rgba(255,255,255,.22);
  --pitch-chip: rgba(6,18,12,.74);
  --pitch-chip-ink: #E9F1EB;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 2px 4px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.8);
  --shadow-accent: 0 8px 20px -10px rgba(61,220,132,.35);
}

/* ---------- Perusta ---------- */

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* manipulation poistaa kaksoisnapautuksen zoomauksen ja napautusviiveen,
   mutta jättää vierityksen ja nipistyszoomauksen ennalleen. */
html, body { height: 100%; touch-action: manipulation; }
button, a, label, input, select, textarea,
.card, .list-item, .chip, .swatch, .toolbtn, .slot, .grade, #tabbar a { touch-action: manipulation; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;              /* sovelluskehys vierittää itse */
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* Sovelluskehys täyttää ruudun: ylapalkki, vierivä sisältö ja alapalkki. */
#app {
  height: 100vh;
  height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
  max-width: 560px; margin: 0 auto;
  background: var(--paper);
}
@media (min-width: 600px) {
  #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

/* Kortit ruudukkoon: yksi sarake puhelimessa, kaksi tai kolme tabletilla.
   minmax(0, 1fr) pitää sarakkeen ruudun levyisenä: ilman sitä pitkä nimi
   levittäisi kortin yli näytön ja näkymän voisi vierittää sivusuunnassa. */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
/* Kortit saavat kutistua sisältöään kapeammiksi (teksti katkeaa kolmella pisteellä). */
.cards > *, .stack > * { min-width: 0; }

/* ---------- Yläpalkki ---------- */

#topbar {
  flex: none; z-index: 20;
  padding: calc(var(--safe-t) + 14px) 16px 14px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; min-height: 60px;
}
#topbar h1 {
  flex: 1; margin: 0;
  font-family: var(--display); font-size: 21px; font-weight: 700;
  letter-spacing: -0.02em; line-height: 1.15;
}
#topbar .sub {
  display: block; margin-top: 2px;
  font-family: var(--body); font-size: 12.5px; font-weight: 400; color: var(--ink-3);
  letter-spacing: 0;
}

.iconbtn {
  flex: none; padding: 0;
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font-size: 18px; cursor: pointer;
}
.iconbtn { transition: transform .08s ease, background-color .12s ease; }
.iconbtn:active { background: var(--surface-2); transform: scale(.94); }
.iconbtn.wide { width: auto; padding: 0 14px; font-size: 14px; font-weight: 600; gap: 6px; }

/* ---------- Sisältöalue ---------- */

#view {
  flex: 1; min-height: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 16px 16px 32px;
}
.stack { display: flex; flex-direction: column; gap: 12px; }

.section-title {
  margin: 24px 2px 8px;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3);
}
.section-title:first-child { margin-top: 0; }

/* ---------- Alapalkki ---------- */

#tabbar {
  flex: none; z-index: 30;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface);
  border-top: 1px solid var(--line);
}
#tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--ink-3);
  font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
  min-width: 0; padding: 0 2px; text-align: center;
}
/* Kuusi välilehteä mahtuu kapeallekin puhelimelle hieman pienemmällä tekstillä. */
@media (max-width: 430px) {
  #tabbar a { font-size: 9.5px; letter-spacing: -.01em; }
  #tabbar a .ic { padding: 4px 10px; }
}
#tabbar a .ic { display: grid; place-items: center; padding: 4px 14px; border-radius: 999px; }
#tabbar a.active { color: var(--accent); }
#tabbar a.active .ic { background: var(--accent-soft); }

/* ---------- Kortit ---------- */

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow-sm);
}
button.card, a.card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  text-decoration: none; color: inherit;
}
button.card.row, a.card.row { display: flex; }
button.card.stack, a.card.stack { display: flex; flex-direction: column; }
button.card:active, a.card:active { background: var(--surface-2); }

.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 600; }
.center { text-align: center; }
.tnum { font-variant-numeric: tabular-nums; }

.empty { text-align: center; color: var(--ink-2); padding: 48px 24px; }
.empty .big {
  width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.empty p { margin: 4px 0; }

hr.sep { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }

/* ---------- Merkit ---------- */

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.badge.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
/* Oman joukkueen merkki, kun seurassa on useampi joukkue. */
.badge.team { background: var(--paper); border-color: var(--line-strong); color: var(--ink-2); }
.badge.win  { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.badge.draw { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }
.badge.loss { background: var(--red-soft); border-color: var(--red-line); color: var(--red); }

.numchip {
  flex: none; width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  font-family: var(--display); font-weight: 700; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.numchip.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
/* Kapea versio listoihin, joissa rivejä on paljon. */
.numchip.sm { width: 30px; height: 30px; font-size: 13px; }

/* Ottelun arvosana kouluasteikolla: numeropainikkeet 4–10. */
.grades { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 10px; }
.grade {
  min-height: 46px; padding: 0;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
  color: var(--ink-2); cursor: pointer;
  font-family: var(--display); font-size: 16px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: transform .08s ease, background-color .12s ease, color .12s ease;
}
.grade.on { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }
.grade:active { background: var(--surface-2); transform: scale(.94); }
.badge.rating { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber); }

/* Valittava kortti: napautus vihreäksi = pelaaja mukana ottelussa. */
.card.pick { border-color: var(--line); transition: background-color .12s ease, border-color .12s ease; }
.card.pick.on { background: var(--accent-soft); border-color: var(--accent); }
.card.pick.on .badge { background: var(--surface); }
.card.pick:active { transform: scale(.99); }

/* Tiivis kortti: listariveille, jotta koko ryhmä mahtuu ruudulle. */
.cards.tight { gap: 8px; }
.card.compact { padding: 10px 12px; }
.card.row.compact { gap: 10px; }

/* ---------- Ottelupäivä-etusivu ---------- */

.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 20px; box-shadow: var(--shadow-md);
}
.eyebrow {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent);
}
.hero .opponent {
  margin: 8px 0 0;
  font-family: var(--display); font-size: 30px; font-weight: 800;
  letter-spacing: -0.025em; line-height: 1.05; text-wrap: balance;
}
.hero .when { margin-top: 8px; color: var(--ink-2); font-size: 14px; }

.countdown {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--display); font-variant-numeric: tabular-nums;
}
.countdown .n { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.countdown .u { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.countdown.soon .n { color: var(--amber); }

.meter { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.mini-pitch {
  position: relative; width: 100%; aspect-ratio: 68 / 44;
  border-radius: 12px; overflow: hidden;
  background: linear-gradient(165deg, var(--pitch-a), var(--pitch-b));
  border: 1px solid var(--line);
}
.mini-pitch .lines { position: absolute; inset: 0; }
.mini-pitch .lines * { stroke: var(--pitch-line); fill: none; stroke-width: .7; }
.mini-pitch i {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.75);
}
.mini-pitch i.gk { background: var(--amber); }
.mini-pitch i.open { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.75); }

.stat-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.stat-strip > div { background: var(--surface); padding: 14px 8px; text-align: center; }
.stat-strip .v { font-family: var(--display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat-strip .k { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-top: 2px; }

/* ---------- Lomake ---------- */

label.field { display: block; }
label.field > span {
  display: block; margin-bottom: 6px;
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-3);
}
label.field + label.field, label.field + .field-row, .field-row + label.field,
label.field + .btn, label.field + .chips, .field-row + .btn { margin-top: 16px; }
/* Rinnakkaiset kentät alkavat samalta riviltä. */
.field-row > label.field + label.field { margin-top: 0; }
label.field .tiny { margin-top: 6px; text-transform: none; letter-spacing: 0; font-weight: 400; }

input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; border-radius: 12px; padding: 12px;
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink);
  outline: none; -webkit-appearance: none; appearance: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 80px; resize: vertical; }
select {
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.field-row { display: flex; gap: 12px; }
.field-row > * { flex: 1; }

/* ---------- Painikkeet ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 48px; padding: 12px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink);
  font-weight: 600; cursor: pointer;
}
a.btn { text-decoration: none; }
.btn { transition: transform .08s ease, background-color .12s ease, filter .12s ease; }
.btn:active, .btn.pressing { transform: scale(.97); background: var(--surface-2); }
.btn.primary:active, .btn.danger:active { background: var(--accent); filter: brightness(.9); }
.btn.danger:active { background: var(--red-soft); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  box-shadow: var(--shadow-accent);
}
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-2); box-shadow: none; }
/* Toimintopainikkeet: selvä reuna ja voimakas painallustila. */
.btn.action { background: var(--surface); border-color: var(--accent-line); color: var(--accent); }
.btn.action:active, .btn.action.pressing {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: scale(.96);
}
.btn.danger { background: var(--red-soft); border-color: var(--red-line); color: var(--red); }
.btn.sm { width: auto; min-height: 40px; padding: 8px 14px; font-size: 13.5px; border-radius: 10px; }
.btn-row { display: flex; gap: 12px; }
.btn-row > .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
/* Joukkuesuodatin: rivi pysyy yhdellä rivillä ja vierii tarvittaessa. */
.chips.scroll-x {
  flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 2px 16px;
}
.chips.scroll-x::-webkit-scrollbar { display: none; }
.chips.scroll-x .chip { flex: none; min-height: 34px; padding: 6px 12px; font-size: 12.5px; }
.chip {
  min-height: 40px; padding: 8px 14px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2);
  font-size: 13.5px; font-weight: 600; cursor: pointer;
}
.chip.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip:active { transform: scale(.96); background: var(--surface-2); }

.segmented {
  display: flex; gap: 3px; padding: 3px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line);
}
.segmented button {
  flex: 1; padding: 9px 6px; border: 0; border-radius: 9px;
  background: none; color: var(--ink-2); font-size: 13.5px; font-weight: 600; cursor: pointer;
}
.segmented button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* ---------- Ottelukello ---------- */

.clock {
  font-family: var(--display); font-size: 54px; font-weight: 800;
  font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1;
}
.segmented.four button { font-size: 12.5px; padding-left: 2px; padding-right: 2px; }
@media (min-width: 720px) {
  .clock { font-size: 64px; }
  .segmented.four button { font-size: 14px; }
}

.score {
  font-family: var(--display); font-size: 30px; font-weight: 800;
  letter-spacing: -0.02em; line-height: 1;
}
.card.event.away { background: var(--surface-2); }
.card.event.away .numchip { background: var(--surface); }

/* Maalin videolinkki tapahtumarivillä. */
.videobtn {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line-strong);
  font-size: 17px; line-height: 1;
  touch-action: manipulation;
}
.videobtn:active { background: var(--surface-2); transform: scale(.94); }

/* Oman joukkueen maali: vihreä pohja ja reunapalkki erottavat sen muista. */
.card.event.ourgoal {
  background: var(--accent-soft); border-color: var(--accent-line);
  box-shadow: inset 4px 0 0 var(--accent), var(--shadow-sm);
}
.card.event.ourgoal .numchip {
  background: var(--surface); border-color: var(--accent-line); color: var(--accent);
}
.card.event.ourgoal .bold { color: var(--accent); }
.card.event.ourgoal .muted { color: var(--ink-2); }

/* ---------- Kenttä ---------- */

.pitch-wrap { position: relative; }
.pitch {
  position: relative; width: 100%; aspect-ratio: 68 / 95;
  border-radius: var(--radius); overflow: hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 8%, rgba(0,0,0,0) 8% 16%),
    linear-gradient(165deg, var(--pitch-a), var(--pitch-b));
  border: 1px solid var(--line);
}
.pitch .lines { position: absolute; inset: 0; }
.pitch .lines * { stroke: var(--pitch-line); fill: none; stroke-width: .6; }

.slot {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  width: 74px; padding: 0; border: 0; background: none; color: inherit; cursor: pointer;
}
.slot .disc {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-weight: 800; font-size: 15px;
  font-variant-numeric: tabular-nums;
  border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.slot.empty .disc {
  background: transparent; color: var(--pitch-chip-ink);
  border-style: dashed; border-color: rgba(255,255,255,.9);
  font-family: var(--body); font-weight: 600; font-size: 11px;
}
.slot.gk:not(.empty) .disc { background: var(--amber); color: #fff; }
.slot .nm {
  max-width: 100%; padding: 1px 6px; border-radius: 6px;
  background: var(--pitch-chip); color: var(--pitch-chip-ink);
  font-size: 10.5px; font-weight: 600; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.slot .pos {
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
  color: var(--pitch-chip-ink); opacity: .75;
}

/* ---------- Taktiikkataulu ---------- */

.pitch.drawing {
  touch-action: none; cursor: crosshair;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}

.pitch.drawing.moving .slot { cursor: grab; touch-action: none; }
.pitch.drawing.moving .slot .disc { box-shadow: 0 0 0 3px var(--accent-soft), 0 2px 6px rgba(0,0,0,.25); }

.pitch.drawing .slot.dragging .disc { transform: scale(1.12); box-shadow: 0 6px 14px rgba(0,0,0,.35); }

.toolrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.toolbtn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 54px; padding: 8px 2px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2);
  transition: transform .08s ease, background-color .12s ease, color .12s ease;
}

  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  box-shadow: var(--shadow-accent);
}
.toolbtn:active, .toolbtn.pressing { transform: scale(.95); background: var(--surface-2); }
.toolbtn.on:active, .toolbtn.on.pressing { background: var(--accent); filter: brightness(.9); }
.toolbtn .sample { display: grid; place-items: center; height: 18px; }
.toolbtn .tiny { font-size: 11px; }

.swatch {
  width: 40px; height: 40px; border-radius: 50%; padding: 0; cursor: pointer;
  background: var(--swatch); border: 2px solid var(--line-strong);
  /* Ohut sisäreuna erottaa tumman värin tummasta taustasta. */
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.3);
  transition: transform .1s ease, box-shadow .12s ease;
}
/* Valittu väri nousee esiin renkaalla, jotta valinta erottuu väristä riippumatta. */
.swatch.on {
  border-color: var(--surface);

}
.swatch:active, .swatch.pressing { transform: scale(.92); }
.swatch.on:active, .swatch.on.pressing { transform: scale(1.02); }
.swatch:disabled { opacity: .35; }

/* ---------- Alkulämmittelyn suunnittelu ---------- */

.drill-wrap {
  display: flex; justify-content: center;

  margin: 0 -16px;
}
@media (min-width: 720px) { .drill-wrap { margin: 0; } }
.drill-surface {
  position: relative; width: 100%; max-width: 100%;
  border-radius: var(--radius); overflow: hidden;
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 8%, rgba(0,0,0,0) 8% 16%),
    linear-gradient(165deg, var(--pitch-a), var(--pitch-b));
  border: 1px solid var(--line);
  touch-action: none;            /* merkkien raahaus ja piirto sormella */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.drill-surface .lines { position: absolute; inset: 0; }
.drill-surface .lines * { stroke: var(--pitch-line); fill: none; stroke-width: .6; }
.drill-surface .ink { position: absolute; inset: 0; pointer-events: none; }

/* Kentälle asetetut merkit */
.mark {
  position: absolute; transform: translate(-50%, -50%);
  display: grid; place-items: center; cursor: grab;
}
.mark.dragging { cursor: grabbing; filter: brightness(1.08); }
.mark .disc {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 13px;
  border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.28);
}
.mark .ball {
  width: 15px; height: 15px; border-radius: 50%;
  background: #FFFFFF; border: 2px solid #14261C;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}
.mark .cone {
  width: 0; height: 0;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-bottom: 17px solid #E2620B;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.35));
}
.mark .goal {
  width: 54px; height: 14px;
  border: 3px solid #FFFFFF; border-bottom: 0;
  border-radius: 3px 3px 0 0;

  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 1px, rgba(255,255,255,0) 1px 7px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.75) 0 1px, rgba(255,255,255,0) 1px 7px);
  box-shadow: 0 1px 5px rgba(0,0,0,.35);
}

/* Työkalupaletti: merkit ja piirtokuviot */
.toolgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.toolgrid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.toolgrid.five .toolbtn .tl { font-size: 9.5px; }
.toolgrid .toolbtn { min-height: 62px; gap: 4px; }
.toolgrid .toolbtn .gl { font-size: 19px; line-height: 1; }
.toolgrid .toolbtn .tl { font-size: 10.5px; font-weight: 600; text-align: center; }
.dot {

  border: 2px solid rgba(255,255,255,.85); box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
/* Valikkorivin kuvake: värillinen pallero tai emoji samassa leveydessä. */
.markicon {
  flex: none; width: 34px; display: grid; place-items: center; font-size: 18px; line-height: 1;

.swatches { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }

@media (min-width: 720px) {

/* ---------- Koko ruudun taktiikkataulu ---------- */

html.board-open, html.board-open body { overflow: hidden; }
.board {
  position: fixed; inset: 0; z-index: 300;
  display: flex; flex-direction: column;
  background: var(--paper);
  padding-top: var(--safe-t);
}
.board-pitch {
  flex: 1; min-height: 0; position: relative;

  flex: none; display: flex; flex-direction: column; gap: 8px;

function clockSeconds(timing, now = Date.now()) {
  if (!timing) return 0;

}

/* ---------- Lohkotaulukko ---------- */

const teamKey = (name) => String(name || '').trim().toLowerCase();

 * Lohkosarjataulukko. Mukaan lasketaan omat ottelut sekä lohkoon käsin
 * kirjatut muiden joukkueiden tulokset. Kaikki lohkon joukkueet näkyvät,

  // joukkue näy kahdesti eri kirjoitusasulla.
  for (const team of group?.teams || []) ensure(team);

    row.ga += conceded;
    if (scored > conceded) { row.w++; row.points += 3; } else if (scored === conceded) { row.d++; row.points += 1; } else row.l++;

    add(g.opponent, g.result.ga || 0, g.result.gf || 0);

    || (b.gf - b.ga) - (a.gf - a.ga)

 * Oman joukkueen saldo turnauksen otteluista.

 */

  const out = { played: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, points: 0 };
  for (const g of games) {
    const r = g.result;
    if (!r) continue;
    out.played++;
    out.gf += r.gf || 0;
    out.ga += r.ga || 0;
    if (r.gf > r.ga) out.w++;

/**
 * touch-action ei yksin riitä: iOS:n Safari zoomaa kaksoisnapautuksesta
 * siitä huolimatta. Toinen napautus estetään siksi tapahtumatasolla, ja
 * samalla Safarin omat nipistyseleet piirtoalustan päällä.

/**
 * Estää selaimen omat eleet: kaksoisnapautuksen zoomauksen, nipistyksen ja
 * tekstin valinnan. `state` voidaan antaa ulkoa, jolloin napautusten ajoitus
 * säilyy myös silloin kun elementti piirretään uudelleen.
 */
function blockBrowserGestures(el, state = { lastTouchEnd: 0 }) {
  el.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - state.lastTouchEnd < 400) e.preventDefault();
    state.lastTouchEnd = now;
  }, { passive: false });

  // Piirtäessä ei myöskään haluta tekstin valintaa tai suurennuslasia.
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  el.addEventListener('dblclick', (e) => e.preventDefault());

  // Safarin epästandardit nipistyseleet.
  for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
    el.addEventListener(type, (e) => e.preventDefault());

function drawOnPitch(pitch, liveGroup, lineup, commit) {
  let points = null;

  const redraw = () => {
    liveGroup.replaceChildren();
    if (points && points.length) renderStroke(liveGroup, { tool, color, points });

  pitch.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.slot')) return;      // pelaajan veto hoituu erikseen
    e.preventDefault();
    pitch.setPointerCapture(e.pointerId);
    points = [normalize(e, pitch)];
    redraw();

  pitch.addEventListener('pointermove', (e) => {
    if (!points) return;
    const next = normalize(e, pitch);
    const last = points[points.length - 1];
    if (Math.hypot(next[0] - last[0], next[1] - last[1]) < 0.7) return;
    points.push(next);
    redraw();
  });

  const finish = () => {
    if (!points) return;
    const drawn = points;
    points = null;
    liveGroup.replaceChildren();
    // Yksittäinen napautus ei jätä jälkeä.
    if (drawn.length < 2) return;
    commit(() => addStroke(lineup, { tool, color, points: drawn }));
  };

  pitch.addEventListener('pointerup', finish);
  pitch.addEventListener('pointercancel', () => { points = null; liveGroup.replaceChildren(); });

    e.preventDefault();

    dragging = true;
    token.setPointerCapture(e.pointerId);
    token.classList.add('dragging');
  });

  token.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const [x, y] = normalize(e, pitch);
    token.style.left = `${x}%`;
    token.style.top = `${y}%`;
  });

  const drop = (e) => {
    if (!dragging) return;
    dragging = false;
    token.classList.remove('dragging');
    const [x, y] = normalize(e, pitch);
    commit(() => movePlayer(lineup, slotIndex, x, y));

  token.addEventListener('pointerup', drop);
  token.addEventListener('pointercancel', () => { dragging = false; token.classList.remove('dragging'); });

  const shapes = [];

  if (stroke.shape === 'kyna') {
    shapes.push(['path', { d: penPath(stroke.points, area) }]);
  } else if (stroke.shape === 'nelio') {
    const b = boxOf(stroke.points);
    shapes.push(['rect', { x: sx(b.x), y: sy(b.y), width: sx(b.w), height: sy(b.h), rx: 0.6 }]);

    const b = boxOf(stroke.points);
    shapes.push(['ellipse', {
      cx: sx(b.x + b.w / 2), cy: sy(b.y + b.h / 2),
      rx: Math.max(0.4, sx(b.w) / 2), ry: Math.max(0.4, sy(b.h) / 2),
    }]);

    shapes.push(['polygon', {
      points: trianglePoints(stroke.points).map(([x, y]) => `${sx(x)},${sy(y)}`).join(' '),
    }]);

    const base = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', ...attrs };
    group.append(el(tag, { ...base, stroke: c.halo, 'stroke-width': HALO_WIDTH }));
    group.append(el(tag, { ...base, stroke: c.value, 'stroke-width': STROKE_WIDTH }));

function dragToken(startEv, token, surface, item, commit) {
  token.setPointerCapture(startEv.pointerId);

    const r = surface.getBoundingClientRect();
    last = {
      x: Math.min(100, Math.max(0, ((ev.clientX - r.left) / r.width) * 100)),
      y: Math.min(100, Math.max(0, ((ev.clientY - r.top) / r.height) * 100)),

    token.style.top = `${last.y}%`;

    token.removeEventListener('pointermove', move);

    token.removeEventListener('pointercancel', end);

      const target = d.elements.find((e) => e.id === item.id);
      if (target) { target.x = last.x; target.y = last.y; }
    });
  };
  token.addEventListener('pointermove', move);
  token.addEventListener('pointerup', end);
  token.addEventListener('pointercancel', end);

    ];
  };

    if (ev.button > 0) return;
    const at = pointOf(ev);

    if (tool === 'poista') {
      const hit = hitElement(drill, at[0], at[1]);
      if (hit) commit((d) => removeElement(d, hit.id));
      return;
    }
    if (tool === 'siirra') return;

    if (ITEMS[tool] || tool === 'pelaaja') {
      ev.preventDefault();
      commit((d) => addItem(d, { id: uid(), kind: tool, color: teamColor, x: at[0], y: at[1] }));
      return;
    }
    if (!SHAPES[tool]) return;

    // Piirtoveto: seurataan sormea ja piirretään esikatselu.
    ev.preventDefault();
    surface.setPointerCapture(ev.pointerId);
    const points = [at];
    const shape = tool;
    const color = inkColor;

    const draw = () => {
      live.replaceChildren();
      const preview = { kind: 'stroke', shape, color, points: SHAPES[shape].free ? points : [points[0], points[points.length - 1]] };
      if (points.length > 1) renderStroke(live, preview, area);
    };
    const move = (e2) => {
      points.push(pointOf(e2));
      draw();
    };
    const end = () => {
      surface.removeEventListener('pointermove', move);
      surface.removeEventListener('pointerup', end);
      surface.removeEventListener('pointercancel', end);
      live.replaceChildren();
      if (points.length > 1) {
        commit((d) => addStroke(d, { id: uid(), shape, color, points }));
      }
    };
    surface.addEventListener('pointermove', move);
    surface.addEventListener('pointerup', end);
    surface.addEventListener('pointercancel', end);
  });
}

const uid = () => Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);

return { drillsView, drillView };
};

      ? h('span', { class: 'badge draw', text: 'Kello on käynyt pitkään – muista päättää ottelu' })
      : null,
    timing.status === 'ended'
      ? h('span', { class: 'badge', text: 'Ottelu päättynyt' })
      : h('div', { class: 'btn-row' },
          h('button', {
            class: running ? 'btn' : 'btn primary',
            onclick: () => commit(running ? pauseTiming : startTiming),
          }, running ? 'Tauko' : (timing.status === 'paused' ? 'Jatka' : 'Käynnistä')),
          h('button', {
            class: 'btn ghost',
            onclick: async () => {
              if (await confirmSheet('Päätä ottelu', 'Kello pysähtyy ja peliajat jäävät talteen.', 'Päätä')) {
                commit(endTiming);
              }
            },
          }, 'Päätä ottelu'))));

  /* --- Tapahtumien kirjaus --- */
  if (timing.status !== 'ended') {
    wrap.append(h('div', { class: 'btn-row' },
      pressable(h('button', { class: 'btn action' }, '⚽ Maali'), () => openGoalSheet(match, commit)),
      pressable(h('button', { class: 'btn action' }, '🟨 Kortti'), () => openCardSheet(match, commit))));
  }

  /* --- Kentällä ja penkillä --- */
  const field = onField(timing, at());
  const squad = [...match.lineup.slots.filter(Boolean), ...match.lineup.bench];
  const times = playingTimes(timing, at());
  const bench = squad.filter((id) => !field.has(id));
  // Vähiten pelannut koko ryhmästä – myös kentällä oleva voi olla vähiten
  // pelannut, joten merkkiä ei voi päätellä pelkästä vaihtopenkistä. Tasatilanne
  // jätetään merkitsemättä, koska silloin merkki ei kertoisi mitään.
  const secondsOf = (id) => times.get(id) || 0;
  const least = squad.length ? Math.min(...squad.map(secondsOf)) : null;
  const atLeast = squad.filter((id) => secondsOf(id) === least);
  const leastPlayed = atLeast.length === 1 ? atLeast[0] : null;

  const row = (playerId, isOn) => {
    const p = playerById(playerId);
    if (!p) return null;
    const timeEl = h('span', { class: 'tnum bold', text: fmtMinutes(times.get(playerId) || 0) });
    live.push({ el: timeEl, playerId });
    return h('div', { class: 'card row' },
      h('span', { class: `numchip${isOn ? ' accent' : ''}`, text: p.number ?? '–' }),
      h('span', { class: 'grow' },
        h('div', { class: 'bold ellip', text: p.name }),
        playerId === leastPlayed
          ? h('span', { class: 'badge draw', text: 'vähiten peliaikaa' })
          : null),
      timeEl,
      h('button', {
        class: isOn ? 'btn sm' : 'btn sm primary',
        disabled: timing.status === 'ended',
        onclick: () => openSwap(match, playerId, isOn, commit),
      }, isOn ? 'Vaihda' : 'Kentälle'));
  };

  wrap.append(h('div', { class: 'section-title', text: `Kentällä (${field.size})` }));
  const byNumber = (a, b) => (playerById(a)?.number ?? 999) - (playerById(b)?.number ?? 999);
  const onList = [...field].filter((id) => squad.includes(id)).sort(byNumber);
  if (!onList.length) {
    wrap.append(h('div', { class: 'card small muted', text: 'Ei pelaajia kentällä.' }));
  } else {
    onList.forEach((id) => add(wrap, row(id, true)));
  }

  wrap.append(h('div', { class: 'section-title', text: `Vaihtopenkillä (${bench.length})` }));
  if (!bench.length) {
    wrap.append(h('div', { class: 'card small muted', text: 'Ei vaihtopelaajia. Lisää heidät kokoonpanoon.' }));
  } else {
    [...bench]
      .sort((a, b) => secondsOf(a) - secondsOf(b))
      .forEach((id) => add(wrap, row(id, false)));
  }

  /* --- Tapahtumat --- */
  wrap.append(h('div', { class: 'section-title', text: 'Tapahtumat' }));
  wrap.append(eventList(match, commit, { editable: true }));

  wrap.append(h('button', {
    class: 'btn danger', style: 'margin-top:12px',
    onclick: async () => {
      if (await confirmSheet('Nollaa peliaika', 'Kello, vaihdot ja peliajat poistetaan tästä ottelusta.', 'Nollaa')) {
        commit(resetTiming);
      }
    },
  }, 'Nollaa peliaikaseuranta'));

  /* --- Sekuntipäivitys --- */
  if (timing.status === 'running') {
    ticker = setInterval(() => {
      if (!document.body.contains(clockEl)) { clearInterval(ticker); return; }
      const live_ = matchById(match.id);
      if (!live_) { clearInterval(ticker); return; }
      const seconds = clockSeconds(live_.timing);
      clockEl.textContent = fmtClock(seconds);
      periodEl.textContent = periodText(seconds, live_.timing);
      const current = playingTimes(live_.timing, seconds);
      for (const item of live) item.el.textContent = fmtMinutes(current.get(item.playerId) || 0);
    }, 1000);
  }

  return wrap;
}

const periodText = (seconds, timing) => {
  const total = totalSeconds(timing);
  if (seconds >= total) return 'Peliaika täynnä';
  return `${periodOf(seconds, timing)}. jakso / ${timing.periods}`;
};

/* ---------- Aloitusnäkymä ---------- */

function startCard(match, wrap, commit) {
  const starters = match.lineup.slots.filter(Boolean).length;
  const timing = ensureTimingView(match);

  wrap.append(h('div', { class: 'card stack center' },
    h('div', { class: 'eyebrow', text: 'Peliaika' }),
    h('p', { class: 'small muted', style: 'margin:6px 0 0' },
      starters
        ? `Avauskokoonpanossa on ${starters} pelaajaa. Kello käynnistyy alkuvihellyksestä ja merkitsee heidät kentälle.`
        : 'Valitse ensin avauskokoonpano Kokoonpano-välilehdellä.'),
    h('div', { class: 'field-row', style: 'margin-top:14px' },
      h('label', { class: 'field' }, h('span', { text: 'Jaksoja' }),
        h('input', { type: 'number', id: 'periods', value: timing.periods, min: '1', max: '4', inputmode: 'numeric' })),
      h('label', { class: 'field' }, h('span', { text: 'Jakson pituus (min)' }),
        h('input', { type: 'number', id: 'plen', value: timing.periodMinutes, min: '5', max: '60', inputmode: 'numeric' }))),
    h('button', {
      class: 'btn primary', disabled: !starters,
      onclick: () => {
        const periods = Number(document.getElementById('periods').value) || 2;
        const periodMinutes = Number(document.getElementById('plen').value) || 30;
        commit((m) => {
          const t = ensureTiming(m);
          t.periods = Math.max(1, periods);
          t.periodMinutes = Math.max(1, periodMinutes);
          startTiming(m);
        });
      },
    }, 'Käynnistä ottelukello')));

  return wrap;
}

const ensureTimingView = (match) => match.timing || { periods: 2, periodMinutes: 30 };

/* ---------- Vaihdon tekeminen ---------- */

function openSwap(match, playerId, isOn, commit) {
  const person = playerById(playerId);
  const timing = match.timing;
  const field = onField(timing);
  const squad = [...match.lineup.slots.filter(Boolean), ...match.lineup.bench];
  const times = playingTimes(timing);
  const options = isOn
    ? squad.filter((id) => !field.has(id))
    : [...field].filter((id) => squad.includes(id));

  sheet(isOn ? `${person?.name} ulos` : `${person?.name} kentälle`, (body, close) => {
    add(body,
      h('p', { class: 'tiny muted', text: isOn ? 'Kuka tulee tilalle?' : 'Kuka jää pois?' }),
      ...options
        .sort((a, b) => (isOn ? (times.get(a) || 0) - (times.get(b) || 0) : (times.get(b) || 0) - (times.get(a) || 0)))
        .map((id) => {
          const other = playerById(id);
          if (!other) return null;
          return h('button', {
            class: 'list-item',
            onclick: () => {
              commit((m) => substitute(m, isOn ? playerId : id, isOn ? id : playerId));
              close();
              toast('Vaihto kirjattu');
            },
          },
            h('span', { class: 'numchip', text: other.number ?? '–' }),
            h('span', { class: 'grow ellip bold', text: other.name }),
            h('span', { class: 'tiny muted tnum', text: fmtMinutes(times.get(id) || 0) }));
        }),
      options.length ? null : h('p', { class: 'muted', text: 'Ei vaihdettavia pelaajia.' }),
      h('button', {
        class: 'btn ghost', style: 'margin-top:12px',
        onclick: () => {
          commit((m) => substitute(m, isOn ? playerId : null, isOn ? null : playerId));
          close();
          toast(isOn ? 'Pelaaja pois kentältä' : 'Pelaaja kentälle');
        },
      }, isOn ? 'Vain ulos (vajaa joukkue)' : 'Vain sisään'));
  });
}

/* ---------- Vaihdon korjaaminen ---------- */

function openEditSub(match, sub, commit) {
  sheet('Korjaa vaihto', (body, close) => {
    const minuteI = h('input', {
      type: 'number', value: Math.round(sub.at / 60), min: '0', max: '200', inputmode: 'numeric',
    });
    add(body,
      h('p', { class: 'small muted' },
        sub.inId ? `Sisään: ${playerById(sub.inId)?.name || '–'}. ` : '',
        sub.outId ? `Ulos: ${playerById(sub.outId)?.name || '–'}.` : ''),
      h('label', { class: 'field' }, h('span', { text: 'Minuutti' }), minuteI),
      h('button', {
        class: 'btn primary',
        onclick: () => {
          commit((m) => moveTimingEvents(m, sub.ids, (Number(minuteI.value) || 0) * 60));
          close();
          toast('Vaihdon aika korjattu');
        },
      }, 'Tallenna'),
      h('button', {
        class: 'btn danger', style: 'margin-top:10px',
        onclick: () => {
          commit((m) => removeTimingEvents(m, sub.ids));
          close();
          toast('Vaihto poistettu');
        },
      }, 'Poista vaihto'));
  });
}

/* ---------- Tapahtumalista ---------- */

const teamLabel = (match, team) => {
  const own = getState().team.name || 'Oma joukkue';
  return team === 'them' ? (match.opponent || 'Vastustaja') : own;
};

/** Yhteinen tapahtumalista seurantaan ja tuloksiin. */
function eventList(match, commit, { editable = false } = {}) {
  const events = matchEvents(match);
  if (!events.length) {
    return h('div', { class: 'card small muted', text: 'Ei kirjattuja tapahtumia.' });
  }

  const list = h('div', { class: 'stack', style: 'gap:8px' });
  for (let i = 0; i < events.length; i++) {
    const e = events[i];
    // Vaihto näytetään yhtenä rivinä: sisään tullut ja ulos mennyt yhdessä.
    const next = events[i + 1];
    const pairedSub = e.type === 'out' && next?.type === 'in' && next.at === e.at;
    if (pairedSub) i++;

    const ours = e.team !== 'them';
    // Oman joukkueen maalit korostetaan, jotta ne erottuvat tapahtumalistasta.
    const ourGoal = ours && e.type === 'goal';
    // Maalille voi tallentaa oman videolinkin; se avataan omaan ikkunaansa.
    // Painike on span, jottei nappia tule napin sisään.
    const clip = ourGoal ? videoInfo(e.videoUrl) : null;
    const row = h(editable ? 'button' : 'div', {
      class: `card row event${ours ? '' : ' away'}${ourGoal ? ' ourgoal' : ''}`,
      onclick: editable ? () => openEventSheet(match, e, commit) : null,
    },
      h('span', { class: 'numchip tnum', style: 'width:auto;padding:0 8px', text: fmtClock(e.at) }),
      h('span', { class: 'grow' }, pairedSub ? subText(next.playerId, e.playerId) : eventText(match, e)),
      clip ? h('span', {
        class: 'videobtn', role: 'button', tabindex: '0',
        title: `Avaa maali ${clip.service}-palvelussa`,
        'aria-label': `Avaa maalin video ${clip.service}-palvelussa`,
        onclick: (ev) => { ev.stopPropagation(); openClip(clip); },
        onkeydown: (ev) => {
          if (ev.key !== 'Enter' && ev.key !== ' ') return;
          ev.preventDefault(); ev.stopPropagation(); openClip(clip);
        },
        text: '🎥',
      }) : null,
      editable ? h('span', { class: 'muted', text: '›' }) : null);
    list.append(row);
  }
  return list;
}

const subText = (inId, outId) => h('span', {},
  h('div', { class: 'bold ellip', text: `▲ ${playerById(inId)?.name || '–'}` }),
  h('div', { class: 'tiny muted ellip', text: `▼ ${playerById(outId)?.name || '–'}` }));

function eventText(match, e) {
  const name = (id) => playerById(id)?.name || null;

  if (e.type === 'goal') {
    return h('span', {},
      h('div', { class: 'bold ellip', text: `⚽ ${name(e.playerId) || teamLabel(match, e.team)}` }),
      h('div', { class: 'tiny muted ellip', text: e.assistId
        ? `Syöttö: ${name(e.assistId) || '–'}`
        : (e.playerId ? teamLabel(match, e.team) : 'Maali') }));
  }

  if (e.type === 'card') {
    return h('span', {},
      h('div', { class: 'bold ellip', text: `${e.card === 'red' ? '🟥' : '🟨'} ${name(e.playerId) || teamLabel(match, e.team)}` }),
      h('div', { class: 'tiny muted', text: `${CARDS[e.card] || 'Kortti'} · ${teamLabel(match, e.team)}` }));
  }

  const label = e.type === 'in' ? '▲ Kentälle' : '▼ Pois kentältä';
  return h('span', {},
    h('div', { class: 'bold ellip', text: `${label}: ${name(e.playerId) || '–'}` }),
    h('div', { class: 'tiny muted', text: 'Vaihto' }));
}

/* ---------- Maalin ja kortin kirjaus ---------- */

const squadOf = (match) => [...match.lineup.slots.filter(Boolean), ...match.lineup.bench];

function playerPicker(match, { onPick, allowNone, noneLabel }) {
  const rows = [];
  const field = onField(match.timing);
  const squad = squadOf(match);
  const sorted = [...squad].sort((a, b) => {
    const onA = field.has(a) ? 0 : 1, onB = field.has(b) ? 0 : 1;
    if (onA !== onB) return onA - onB;
    return (playerById(a)?.number ?? 999) - (playerById(b)?.number ?? 999);
  });

  for (const id of sorted) {
    const p = playerById(id);
    if (!p) continue;
    rows.push(pressable(h('button', { class: 'list-item' },
      h('span', { class: `numchip${field.has(id) ? ' accent' : ''}`, text: p.number ?? '–' }),
      h('span', { class: 'grow ellip bold', text: p.name }),
      field.has(id) ? h('span', { class: 'badge accent', text: 'kentällä' }) : null), () => onPick(id)));
  }
  if (allowNone) {
    rows.push(pressable(h('button', { class: 'btn ghost', style: 'margin-top:8px' }, noneLabel), () => onPick(null)));
  }
  return rows;
}

function openGoalSheet(match, commit) {
  sheet('Maali', (body, close) => {
    const own = getState().team.name || 'Oma joukkue';
    add(body,
      h('p', { class: 'tiny muted', text: 'Kummalle joukkueelle maali kirjataan?' }),
      pressable(h('button', { class: 'btn primary', style: 'margin-bottom:10px' }, `${own} teki maalin`), () => {
        close();
        openScorerSheet(match, commit);
      }),
      pressable(h('button', { class: 'btn' }, `${match.opponent || 'Vastustaja'} teki maalin`), () => {
        commit((m) => recordGoal(m, { team: 'them' }));
        close();
        toast('Vastustajan maali kirjattu');
      }));
  });
}

function openScorerSheet(match, commit) {
  sheet('Maalintekijä', (body, close) => {
    add(body,
      h('p', { class: 'tiny muted', text: 'Kuka teki maalin?' }),
      ...playerPicker(match, {
        allowNone: true,
        noneLabel: 'Ei tiedossa',
        onPick: (playerId) => {
          close();
          if (!playerId) {
            commit((m) => recordGoal(m, { team: 'us' }));
            toast('Maali kirjattu');
            return;
          }
          openAssistSheet(match, commit, playerId);
        },
      }));
  });
}

function openAssistSheet(match, commit, scorerId) {
  sheet('Syöttäjä', (body, close) => {
    add(body,
      h('p', { class: 'tiny muted', text: `Maalintekijä ${playerById(scorerId)?.name || ''}. Kuka syötti?` }),
      ...playerPicker(match, {
        allowNone: true,
        noneLabel: 'Ei syöttäjää',
        onPick: (assistId) => {
          commit((m) => recordGoal(m, { team: 'us', playerId: scorerId, assistId: assistId === scorerId ? null : assistId }));
          close();
          toast('Maali kirjattu');
        },
      }));
  });
}

function openCardSheet(match, commit) {
  sheet('Kortti', (body, close) => {
    const own = getState().team.name || 'Oma joukkue';
    const pick = (card) => {
      close();
      sheet(CARDS[card], (b2, close2) => {
        add(b2,
          h('p', { class: 'tiny muted', text: 'Kenelle kortti kirjataan?' }),
          ...playerPicker(match, {
            allowNone: false,
            onPick: (playerId) => {
              commit((m) => recordCard(m, { team: 'us', card, playerId }));
              close2();
              toast(`${CARDS[card]} kirjattu`);
            },
          }),
          h('div', { class: 'section-title', text: match.opponent || 'Vastustaja' }),
          pressable(h('button', { class: 'btn' }, `${match.opponent || 'Vastustaja'}: ${CARDS[card].toLowerCase()}`), () => {
            commit((m) => recordCard(m, { team: 'them', card }));
            close2();
            toast(`${CARDS[card]} kirjattu`);
          }));
      });
    };

    add(body,
      h('p', { class: 'tiny muted', text: `Kortin väri. Oman joukkueen kortti kirjataan pelaajalle (${own}).` }),
      pressable(h('button', { class: 'btn', style: 'margin-bottom:10px;border-color:var(--amber);color:var(--amber)' }, '🟨 Keltainen kortti'), () => pick('yellow')),
      pressable(h('button', { class: 'btn', style: 'border-color:var(--red);color:var(--red)' }, '🟥 Punainen kortti'), () => pick('red')));
  });
}

/* ---------- Tapahtuman muokkaus ---------- */

/** Ryhmän pelaajat valintalistaksi; mukaan myös tapahtumaan jo merkitty pelaaja. */
function playerOptions(match, selected, { emptyLabel = null } = {}) {
  const ids = [...new Set([...squadOf(match), ...(selected ? [selected] : [])])]
    .filter((id) => playerById(id))
    .sort((a, b) => (playerById(a)?.number ?? 999) - (playerById(b)?.number ?? 999));
  const sel = h('select', {},
    emptyLabel ? h('option', { value: '', text: emptyLabel, selected: !selected }) : null,
    ...ids.map((id) => {
      const p = playerById(id);
      return h('option', {
        value: id, selected: id === selected,
        text: `${p.number ?? '–'} ${p.name}`,
      });
    }));
  return sel;
}

/**
 * Tapahtuman muokkaus: pelaajat ja aika, sekä tapahtuman poisto. Käytössä sekä
 * seurannassa ottelun aikana että tuloksen aikajanalla jälkikäteen.
 */
function openEventSheet(match, e, commit) {
  if (e.legacy) {
    sheet('Vanha maalikirjaus', (body, close) => {
      add(body,
        h('p', { class: 'small muted', text: 'Tämä maali on kirjattu ennen otteluseurantaa, joten sen aikaa ei voi muuttaa.' }),
        pressable(h('button', { class: 'btn danger' }, 'Poista maali'), () => {
          commit((m) => removeResultEvent(m, e.id));
          close();
          toast('Maali poistettu');
        }));
    });
    return;
  }

  const subIds = pairedIds(match, e);
  // Vaihdossa rivi kattaa kaksi tapahtumaa: ulos menevä ja sisään tuleva.
  const events = (match.timing?.events || []);
  const outEvent = e.type === 'out' ? e : events.find((x) => x.type === 'out' && subIds.includes(x.id));
  const inEvent = e.type === 'in' ? e : events.find((x) => x.type === 'in' && subIds.includes(x.id));

  sheet('Muokkaa tapahtumaa', (body, close) => {
    const minuteI = h('input', { type: 'number', value: Math.round(e.at / 60), min: '0', max: '200', inputmode: 'numeric' });
    add(body, h('p', { class: 'small muted' }, eventText(match, e)));

    // Pelaajakentät tapahtuman tyypin mukaan; vastustajan maalilla ei ole pelaajaa.
    const fields = [];
    let videoField = null;
    const ours = e.team !== 'them';
    if (e.type === 'goal' && ours) {
      const scorerI = playerOptions(match, e.playerId, { emptyLabel: 'Ei pelaajaa' });
      const assistI = playerOptions(match, e.assistId, { emptyLabel: 'Ei syöttäjää' });
      // Maalikohtainen videolinkki, esimerkiksi Veon leike juuri tästä maalista.
      const videoI = h('input', {
        type: 'text', value: e.videoUrl || '', autocomplete: 'off',
        inputmode: 'url', placeholder: 'https://app.veo.co/matches/...',
      });
      add(body,
        h('label', { class: 'field' }, h('span', { text: 'Maalintekijä' }), scorerI),
        h('label', { class: 'field' }, h('span', { text: 'Syöttäjä' }), assistI),
        h('label', { class: 'field' },
          h('span', { text: 'Maalin videolinkki' }), videoI,
          h('span', { class: 'tiny muted', text: 'Esimerkiksi Veon leike tästä maalista. Tapahtumalistaan tulee 🎥, josta linkki avautuu.' })));
      videoField = videoI;
      fields.push(() => ({ id: e.id, patch: {
        playerId: scorerI.value || null,
        assistId: assistI.value && assistI.value !== scorerI.value ? assistI.value : null,
        videoUrl: videoI.value.trim(),
      } }));
    } else if (e.type === 'card' && ours) {
      const playerI = playerOptions(match, e.playerId, { emptyLabel: 'Ei pelaajaa' });
      add(body, h('label', { class: 'field' }, h('span', { text: 'Pelaaja' }), playerI));
      fields.push(() => ({ id: e.id, patch: { playerId: playerI.value || null } }));
    } else if (outEvent || inEvent) {
      if (outEvent) {
        const outI = playerOptions(match, outEvent.playerId);
        add(body, h('label', { class: 'field' }, h('span', { text: 'Pois kentältä' }), outI));
        fields.push(() => ({ id: outEvent.id, patch: { playerId: outI.value || null } }));
      }
      if (inEvent) {
        const inI = playerOptions(match, inEvent.playerId);
        add(body, h('label', { class: 'field' }, h('span', { text: 'Kentälle' }), inI));
        fields.push(() => ({ id: inEvent.id, patch: { playerId: inI.value || null } }));
      }
    }

    add(body,
      h('label', { class: 'field' },
        h('span', { text: 'Minuutti' }), minuteI,
        h('span', { class: 'tiny muted', text: 'Ottelukellon minuutti, jolloin tapahtuma sattui.' })),
      pressable(h('button', { class: 'btn primary' }, 'Tallenna'), () => {
        const link = videoField ? videoField.value.trim() : '';
        if (link && !videoInfo(link)) {
          toast('Videolinkin pitää alkaa https://');
          videoField.focus();
          return;
        }
        const changes = fields.map((read) => read());
        commit((m) => {
          for (const { id, patch } of changes) updateTimingEvent(m, id, patch);
          moveTimingEvents(m, subIds, (Number(minuteI.value) || 0) * 60);
        });
        close();
        toast('Tapahtuma tallennettu');
      }),
      pressable(h('button', { class: 'btn danger', style: 'margin-top:10px' }, 'Poista tapahtuma'), () => {
        commit((m) => removeTimingEvents(m, subIds));
        close();
        toast('Tapahtuma poistettu');
      }));
  });
}

/** Vaihto poistetaan parina, muut tapahtumat yksin. */
/** Avaa maalin videon omaan ikkunaansa (selain tai palvelun oma sovellus). */
function openClip(clip) {
  const win = window.open(clip.url, '_blank', 'noopener,noreferrer');
  if (!win) toast('Selain esti ikkunan avaamisen');
}

function pairedIds(match, e) {
  if (e.type !== 'in' && e.type !== 'out') return [e.id];
  const pair = (match.timing?.events || []).find((x) =>
    x.id !== e.id && x.at === e.at && (x.type === 'in' || x.type === 'out') && x.type !== e.type);
  return pair ? [e.id, pair.id] : [e.id];
}

/* ---------- Kauden yhteenveto ---------- */

/** Pelaajan kokonaispeliaika sekunteina pelatuista otteluista. */
function seasonPlayingTime(matches, playerId) {
  let seconds = 0;
  for (const m of matches) {
    if (!m.timing) continue;
    seconds += playingTimes(m.timing, clockSeconds(m.timing)).get(playerId) || 0;
  }
  return seconds;
}

return { trackingTab, eventList, seasonPlayingTime };
};

  const today = new Date().toISOString().slice(0, 10);
  const own = matches.filter((m) => !m.tournamentId);
  const tournaments = sortedTournaments().filter((t) => {
    const end = t.endDate || t.startDate;

    // Joukkuesuodatin: turnaus näkyy, jos siinä on suodatetun joukkueen ottelu

/* ---------- Seuraava ottelu ---------- */

function nextMatchHero(m) {
  const f = getFormation(m.lineup.formation);

function countdown(days) {

/** Pieni vaakakenttä, joka näyttää yhdellä silmäyksellä montako paikkaa on täynnä. */
function miniPitch(lineup, formation) {
  const pitch = h('div', { class: 'mini-pitch' });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'lines');
  svg.setAttribute('viewBox', '0 0 95 68');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = `
    <line x1="47.5" y1="2" x2="47.5" y2="66" />
    <circle cx="47.5" cy="34" r="8" />
    <rect x="2" y="20" width="11" height="28" />
    <rect x="82" y="20" width="11" height="28" />`;
  pitch.append(svg);
  formation.slots.forEach((slot, i) => {
    const filled = !!lineup.slots[i];
    // Pystykenttä käännetään vaakaan: oma maali vasemmalle.
    pitch.append(h('i', {
      class: `${filled ? '' : 'open'}${slot.pos === 'MV' && filled ? ' gk' : ''}`.trim(),
      style: `left:${100 - slot.y}%;top:${slot.x}%`,

  return pitch;

/* ---------- Viimeisin tulos ---------- */

function lastResultCard(m) {
  const r = m.result;
  const cls = r.gf > r.ga ? 'win' : r.gf === r.ga ? 'draw' : 'loss';
  const label = r.gf > r.ga ? 'Voitto' : r.gf === r.ga ? 'Tasapeli' : 'Tappio';
  // Sama maalintekijä kootaan yhdeksi riviksi: "Koski x2, Hakala".
  const tally = new Map();
  for (const e of matchEvents(m)) {
    if (e.type !== 'goal' || e.team === 'them' || !e.playerId) continue;
    tally.set(e.playerId, (tally.get(e.playerId) || 0) + 1);
  }
  const scorers = [...tally].map(([id, n]) => (n > 1 ? `${playerName(id)} ×${n}` : playerName(id)));
  const video = videoInfo(m.videoUrl);

  const card = h('button', { class: 'card stack', style: 'gap:12px', onclick: () => navigate(`#/ottelu/${m.id}`) },

      h('span', {

        text: scoreText(m),

    h('div', { class: 'row', style: 'gap:8px;flex-wrap:wrap' },

      scorers.length ? h('span', { class: 'tiny muted ellip', text: scorers.join(', ') }) : null,
      video ? h('span', { class: 'badge' }, icon('play', 11), 'Video') : null));

  return card;
}

/* ---------- Kauden luvut ---------- */

function seasonStrip(played) {
  let w = 0, d = 0, l = 0, gf = 0, ga = 0;
  for (const m of played) {
    gf += m.result.gf || 0;
    ga += m.result.ga || 0;
    if (m.result.gf > m.result.ga) w++;
    else if (m.result.gf === m.result.ga) d++;
    else l++;
  }
  const cell = (v, k) => h('div', {}, h('div', { class: 'v', text: v }), h('div', { class: 'k', text: k }));
  return h('div', { style: 'margin-top:24px' },
    h('div', { class: 'section-title', text: 'Kausi tähän mennessä' }),
    h('div', { class: 'stat-strip' },
      cell(String(played.length), 'Ottelua'),
      cell(`${w}–${d}–${l}`, 'V–T–H'),
      cell(`${gf}–${ga}`, 'Maalit')));
}

    error: 'Synkronointi epäonnistui – katso asetukset',

  if (!text) return null;
  return h('button', {
    class: 'tiny muted center',
    style: 'background:none;border:0;padding:12px 0 0;width:100%;cursor:pointer',
    onclick: () => navigate('#/asetukset'),

}

  const d = new Date(`${dateStr}T00:00`);
  return isNaN(d) ? '–' : `${d.getDate()}.${d.getMonth() + 1}.`;
};

return { homeView };
};

/* ---------- Kokoonpanon jakaminen ---------- */

function lineupText(m) {
  const st = getState();
  const f = getFormation(m.lineup.formation);
  const who = (id) => {
    const p = playerById(id);
    if (!p) return '–';
    return `${p.number != null ? p.number + ' ' : ''}${p.name}`;
  };
  const lines = [
    `${m.team || st.team.name || 'Oma joukkue'} ${m.home ? 'vs' : '@'} ${m.opponent || 'vastustaja'}`,
    `${fmtDate(m.date)} klo ${m.time}${m.venue ? ' · ' + m.venue : ''}`,
    `Kokoonpano ${f.name}`,
    '',
  ];
  f.slots.forEach((slot, i) => {
    const pid = m.lineup.slots[i];
    lines.push(`${slot.pos.padEnd(4, ' ')}${pid ? who(pid) : '(avoin)'}`);
  });
  if (m.lineup.bench.length) lines.push('', `Vaihdot: ${m.lineup.bench.map(who).join(', ')}`);
  if ((m.lineup.staff || []).length) {
    const staff = m.lineup.staff
      .map((id) => staffById(id))
      .filter(Boolean)
      .map((person) => `${person.name} (${STAFF_ROLES[person.role] || 'toimihenkilö'})`);
    if (staff.length) lines.push('', `Valmennus: ${staff.join(', ')}`);
  }
  // Poissaolijat ovat mielekkäitä vasta kun ryhmä on valittu.
  const squadPicked = m.lineup.slots.filter(Boolean).length + m.lineup.bench.length;
  const absent = squadPicked ? absentIds(m.lineup) : [];
  if (absent.length) lines.push('', `Poissa: ${absent.map(who).join(', ')}`);
  if (m.notes) lines.push('', m.notes);
  return lines.join('\n');
}

async function shareLineup(m) {
  const text = lineupText(m);
  const title = `Kokoonpano – ${m.opponent || 'ottelu'}`;

  // Kuva kenttäkokoonpanosta jaetaan tekstin mukana, jos laite tukee sitä.
  let file = null;

      return;
    }
    if (navigator.share) { await navigator.share({ title, text }); return; }

    h('p', { class: 'small muted', text: 'Kaikki tiedot tallentuvat vain tähän laitteeseen. Ota varmuuskopio ennen selaimen tietojen tyhjennystä tai kun vaihdat puhelinta.' }),
    h('button', { class: 'btn', onclick: doExport }, 'Vie tiedot'),
    h('button', { class: 'btn', onclick: doImport }, 'Tuo tiedot')));

  body.append(h('div', { class: 'section-title', text: 'Sovellus' }));
  body.append(h('div', { class: 'card stack' },
    h('div', { class: 'row between' },
      h('span', { class: 'small muted', text: 'Pelaajia' }), h('span', { class: 'bold', text: String(st.players.length) })),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted', text: 'Tapahtumia' }), h('span', { class: 'bold', text: String(st.matches.length) })),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted', text: 'Kokoonpanopohjia' }), h('span', { class: 'bold', text: String(st.lineups.length) })),
    h('div', { class: 'row between' },
      h('span', { class: 'small muted', text: 'Versio' }), h('span', { class: 'bold', text: '1.0.0' }))));

  body.append(h('button', {
    class: 'btn danger', style: 'margin-top:14px',
    onclick: async () => {
      if (await confirmSheet('Tyhjennä kaikki tiedot', 'Pelaajat, ottelut ja kokoonpanot poistetaan pysyvästi tästä laitteesta.', 'Tyhjennä')) {
        resetAll();
        toast('Tiedot tyhjennetty');
      }
    },
  }, 'Tyhjennä kaikki tiedot'));

  return { title: 'Asetukset', back: '#/ottelupaiva', body };
}

/* ---------- Pilvitallennus ---------- */

let stopStatus = null;

function statusLine() {
  const st = getStatus();
  const line = h('div', { class: 'row', style: 'gap:8px' });
  const texts = {
    syncing: ['badge', 'Synkronoidaan…'],
    idle: ['badge win', `Synkronoitu ${timeAgo(st.lastSync)}`],
    offline: ['badge draw', 'Ei verkkoyhteyttä'],
    error: ['badge loss', 'Synkronointi epäonnistui'],
    off: ['badge', 'Ei käytössä'],
  };
  const [cls, text] = texts[st.state] || texts.off;
  line.append(h('span', { class: cls, text }));
  if (st.state === 'error' && st.message) {
    line.append(h('span', { class: 'tiny muted grow ellip', text: st.message }));
  }
  return line;
}

function cloudCard() {
  stopStatus?.();
  const card = h('div', { class: 'card stack' });

  const draw = () => {
    card.replaceChildren();
    const cfg = getConfig();
    const session = getSession();

    if (!cfg) {
      const urlI = h('input', { type: 'text', placeholder: 'https://xxxx.supabase.co', autocomplete: 'off', inputmode: 'url' });
      const keyI = h('input', { type: 'text', placeholder: 'Julkinen anon-avain', autocomplete: 'off' });
      card.append(
        h('p', { class: 'small muted', text: 'Tallenna tiedot pilveen, niin voit muokata samaa joukkuetta useammalla laitteella. Tarvitset oman ilmaisen Supabase-projektin – ohjeet ovat README-tiedostossa.' }),
        h('label', { class: 'field' }, h('span', { text: 'Projektin osoite' }), urlI),
        h('label', { class: 'field' }, h('span', { text: 'Julkinen avain (anon)' }), keyI),
        h('button', {
          class: 'btn primary',
          onclick: () => {
            try {
              setConfig(urlI.value, keyI.value);
              toast('Yhteys tallennettu');
              draw();
            } catch (e) {
              toast(e.message);
            }
          },
        }, 'Ota käyttöön'));
      return;
    }

    if (!session) {
      const emailI = h('input', { type: 'text', placeholder: 'sähköposti', autocomplete: 'username', inputmode: 'email' });
      const passI = h('input', { type: 'password', placeholder: 'salasana', autocomplete: 'current-password' });
      const run = async (fn, label) => {
        toast(label);
        try {
          await fn(emailI.value.trim(), passI.value);
          toast('Kirjauduttu sisään');
          draw();
        } catch (e) {
          toast(e.message);
        }
      };
      card.append(
        h('p', { class: 'small muted', text: `Projekti: ${cfg.url.replace(/^https?:\/\//, '')}` }),
        h('label', { class: 'field' }, h('span', { text: 'Sähköposti' }), emailI),
        h('label', { class: 'field' }, h('span', { text: 'Salasana' }), passI),
        h('div', { class: 'btn-row' },
          h('button', { class: 'btn primary', onclick: () => run(signIn, 'Kirjaudutaan…') }, 'Kirjaudu'),
          h('button', { class: 'btn', onclick: () => run(signUp, 'Luodaan tunnusta…') }, 'Luo tunnus')),
        h('button', { class: 'btn sm ghost', style: 'width:100%', onclick: () => { forgetConfig(); draw(); } }, 'Unohda yhteysasetukset'));
      return;
    }

    card.append(
      h('div', { class: 'row between' },
        h('span', { class: 'small muted', text: 'Tunnus' }),
        h('span', { class: 'bold ellip', text: session.email || '–' })),
      statusLine(),
      h('div', { class: 'btn-row' },
        h('button', {
          class: 'btn',
          onclick: async () => {
            const r = await syncNow();
            if (r.ok) toast(r.conflicts ? `Synkronoitu, ${r.conflicts} ristiriitaa ratkaistiin tämän laitteen hyväksi` : 'Synkronoitu');
            else if (r.reason === 'offline') toast('Ei verkkoyhteyttä');
            else if (r.reason !== 'busy') toast('Synkronointi epäonnistui');
            draw();
          },
        }, 'Synkronoi nyt'),
        h('button', {
          class: 'btn ghost',
          onclick: async () => { await signOut(); toast('Kirjauduttu ulos'); draw(); },
        }, 'Kirjaudu ulos')),
      h('p', { class: 'tiny muted', style: 'margin:0', text: 'Muutokset lähtevät pilveen automaattisesti, ja pilven muutokset haetaan kun palaat sovellukseen. Tiedot säilyvät laitteella myös offline-tilassa.' }));
  };

  draw();
  stopStatus = onStatus(() => { if (document.body.contains(card)) draw(); else stopStatus?.(); });
  return card;
}

function doExport() {
  const json = exportJSON();
  const name = `pelikirja-${new Date().toISOString().slice(0, 10)}.json`;

  sheet('Vie tiedot', (body) => {
    body.append(
      h('p', { class: 'small muted', text: 'Tallenna varmuuskopio tiedostoksi tai kopioi se talteen esimerkiksi muistiinpanoihin. Tuo se myöhemmin takaisin Tuo tiedot -painikkeella.' }),
      h('button', {
        class: 'btn primary', style: 'margin-bottom:10px',
        onclick: () => {
          const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
          const a = h('a', { href: url, download: name, style: 'display:none' });
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast('Tiedosto tallennettu');
        },
      }, 'Lataa varmuuskopio'),
      h('button', {
        class: 'btn', style: 'margin-bottom:14px',
        onclick: async () => {
          try {
            await navigator.clipboard.writeText(json);
            toast('Varmuuskopio kopioitu');
          } catch {
            ta.focus();
            ta.select();
            toast('Kopioi teksti alta');
          }
        },
      }, 'Kopioi leikepöydälle'));
    const ta = h('textarea', { style: 'min-height:160px;font-family:ui-monospace,monospace;font-size:12px', text: json });
    body.append(ta);
  });
}

function doImport() {
  sheet('Tuo tiedot', (body, close) => {
    const ta = h('textarea', {
      style: 'min-height:160px;font-family:ui-monospace,monospace;font-size:12px',
      placeholder: 'Liitä varmuuskopion sisältö tähän',
    });

    const load = (text) => {
      try {
        importJSON(text);
        close();
        toast('Tiedot tuotu');
      } catch (e) {
        toast('Sisältö ei kelpaa varmuuskopioksi');
        console.warn(e);
      }
    };

    const file = h('input', { type: 'file', accept: 'application/json,.json', style: 'display:none' });
    file.addEventListener('change', async () => {
      if (file.files?.[0]) load(await file.files[0].text());
    });

    body.append(
      h('p', { class: 'small muted', text: 'Nykyiset tiedot korvautuvat varmuuskopion sisällöllä.' }),
      file,
      h('button', { class: 'btn primary', style: 'margin-bottom:10px', onclick: () => file.click() }, 'Valitse tiedosto'),
      h('div', { class: 'section-title', text: 'Tai liitä teksti' }),
      ta,
      h('button', { class: 'btn', style: 'margin-top:10px', onclick: () => load(ta.value) }, 'Tuo liitetty teksti'));
  });
}

return { settingsView };
};
